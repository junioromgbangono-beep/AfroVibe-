name: Build AfroVibe APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Creer la configuration Android
        run: flutter create --platforms=android .

      - name: Installer les dependances
        run: flutter pub get

      - name: Verifier Flutter
        run: flutter doctor -v

      - name: Construire l'APK et afficher l'erreur
        shell: bash
        run: |
          set +e
          flutter build apk --release --verbose > build-log.txt 2>&1
          RESULT=$?

          echo "========== ERREURS IMPORTANTES =========="
          grep -n -E -B 5 -A 15 'What went wrong|FAILURE: Build failed|Caused by:|Could not|error:|e: ' build-log.txt | tail -n 120 || true

          echo "========== FIN DU JOURNAL =========="
          tail -n 80 build-log.txt

          exit "$RESULT"

      - name: Conserver les journaux de compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journaux-afrovibe
          path: |
            build/
            build-log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Recuperer l'APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AfroVibe-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
